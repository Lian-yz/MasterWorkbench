[package]
name = "masters-workbench"
version = "5.0.282"
description = "MasterWorkbench - Windows 桌面端 (Tauri)"
authors = ["Lian-yz"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }

[lib]
name = "masters_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
